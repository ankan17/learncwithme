---
layout: default
---

<div class="container post-container" post-serial="{{ page.serial }}">

    <h1 class="text-center post-title">{{ page.title }}</h1>
    <h3 class="text-center post-meta">{{ page.meta }}</h3>
    <p class="content-date">{{ page.date | date: "%B %d, %Y" }}</p>
    <div class="post-content">
        {{ content }}
    </div>

    <!-- Pagination links -->
    <div class="pagination">

        {% if page.previous.url %}
            <a class="pagination-item previous" href="{{ site.baseurl }}{{ page.previous.url }}">Previous</a>
        {% else %}
            <span class="pagination-item previous">Previous</span>
        {% endif %}

        {% if page.next.url %}
            <a class="pagination-item next" href="{{ site.baseurl }}{{ page.next.url }}">Next</a>
        {% else %}
            <span class="pagination-item next">Next</span>
        {% endif %}

    </div>

</div>
